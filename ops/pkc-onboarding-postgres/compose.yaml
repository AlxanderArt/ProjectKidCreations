name: pkc-onboarding-postgres

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 200
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: pkc_founder_mfa
      POSTGRES_USER: pkc_bootstrap_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/pkc_bootstrap_auth_file
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256 --auth-local=scram-sha-256
    entrypoint:
      - /usr/local/bin/pkc-postgres-entrypoint.sh
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/pkc-postgres-entrypoint.sh:/usr/local/bin/pkc-postgres-entrypoint.sh:ro
    tmpfs:
      - /var/run/postgresql/pkc-tls:rw,noexec,nosuid,nodev,size=1m,mode=0700
    secrets:
      - pkc_bootstrap_auth_file
      - postgres_server_cert
      - postgres_server_key
      - postgres_client_ca
    networks:
      pkc_private:
        aliases:
          - pkc-postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname \"$${POSTGRES_DB}\" --username \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
    name: pkc_onboarding_postgres_data

networks:
  pkc_private:
    name: pkc_onboarding_private
    internal: true

secrets:
  pkc_bootstrap_auth_file:
    file: ./secrets/postgres_bootstrap_password
  postgres_server_cert:
    file: ./secrets/postgres_server_cert
  postgres_server_key:
    file: ./secrets/postgres_server_key
  postgres_client_ca:
    file: ./secrets/postgres_client_ca
